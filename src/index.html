<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Управление двигателем</title>
    <style>
      body {
        font:
          16px system-ui,
          sans-serif;
        background: #f2f5f9;
        color: #182335;
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 420px;
        margin: 10vh auto;
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 6px 30px #0001;
      }
      h1 {
        font-size: 24px;
      }
      label {
        display: block;
        margin: 22px 0 8px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        font: inherit;
        padding: 12px;
        border: 1px solid #bac5d3;
        border-radius: 8px;
      }
      button {
        font: inherit;
        cursor: pointer;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #e7edf5;
        color: #182335;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .wide {
        width: 100%;
        margin-top: 12px;
      }
      .start {
        background: #225ed6;
        color: white;
        font-weight: 600;
      }
      .stop {
        background: #bd2026;
        color: white;
        font-weight: 700;
      }
      #status {
        min-height: 1.5em;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Управление двигателем</h1>
      <label for="revs">Количество оборотов (1–1000)</label>
      <div class="row">
        <input
          id="revs"
          type="number"
          min="1"
          max="1000"
          step="1"
          value="5"
        /><button id="minus" type="button" aria-label="Уменьшить">−</button
        ><button id="plus" type="button" aria-label="Увеличить">+</button>
      </div>
      <button id="direction" class="wide" type="button">
        Направление: по часовой
      </button>
      <button id="start" class="wide start" type="button" disabled>Вращать</button>
      <button id="stop" class="wide stop" type="button">Экстренный стоп</button>
      <p id="status" role="status"></p>
      <script>
        let clockwise = true, busy = false, ready = false, token = null;
        let pendingMove = false, stopping = false, uncertain = false, generation = 0;
        let stopPromise = null;
        const input = document.getElementById("revs"),
          status = document.getElementById("status");
        const start = document.getElementById("start"),
          direction = document.getElementById("direction");
        function controls() {
          start.disabled = busy || !ready || !token || pendingMove || stopping || uncertain;
        }
        function adjust(n) {
          let v = Number(input.value);
          if (!Number.isInteger(v)) v = 1;
          input.value = Math.max(1, Math.min(1000, v + n));
        }
        document.getElementById("minus").onclick = () => adjust(-1);
        document.getElementById("plus").onclick = () => adjust(1);
        direction.onclick = () => {
          clockwise = !clockwise;
          direction.textContent =
            "Направление: " + (clockwise ? "по часовой" : "против часовой");
        };
        async function request(url, options = {}) {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 12000);
          try {
            return await fetch(url, { ...options, signal: controller.signal });
          } finally {
            clearTimeout(timeout);
          }
        }
        async function refreshStatus() {
          const observedGeneration = generation;
          try {
            const r = await request("/status", { cache: "no-store" });
            if (!r.ok) throw new Error("Ошибка соединения");
            const s = await r.json();
            if (observedGeneration !== generation || stopping || uncertain) return;
            busy = s.busy;
            ready = s.ready;
            token = s.token;
            if (!ready) status.textContent = "Таймер двигателя недоступен.";
            else if (busy) status.textContent = "Двигатель вращается…";
            else status.textContent = "Двигатель остановлен.";
          } catch (e) {
            if (observedGeneration !== generation) return;
            ready = false;
            token = null;
            if (!stopping && !uncertain) status.textContent = "Нет связи с устройством.";
          } finally {
            controls();
          }
        }
        async function stopMotor() {
          if (stopPromise) return stopPromise;
          stopping = true;
          uncertain = true;
          ++generation;
          token = null;
          controls();
          status.textContent = "Отправка команды остановки…";
          stopPromise = (async () => {
            try {
              const r = await request("/stop", { method: "POST" });
              if (!r.ok) throw new Error(await r.text());
              uncertain = false;
              busy = false;
            } catch (e) {
              status.textContent = "Не удалось подтвердить остановку. Повторите остановку.";
            } finally {
              stopping = false;
              controls();
            }
            if (!uncertain) await refreshStatus();
          })();
          try { await stopPromise; } finally { stopPromise = null; }
        }
        start.onclick = async () => {
          if (start.disabled) return;
          const v = Number(input.value);
          if (!Number.isInteger(v) || v < 1 || v > 1000) {
            status.textContent = "Введите целое число от 1 до 1000.";
            return;
          }
          const moveToken = token;
          const moveGeneration = ++generation;
          pendingMove = true;
          token = null;
          controls();
          try {
            const r = await request("/move", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ revolutions: String(v), direction: clockwise ? "1" : "0", token: moveToken }),
            });
            if (moveGeneration !== generation) return;
            if (!r.ok) {
              status.textContent = "Команда отклонена: " + await r.text();
              await refreshStatus();
              return;
            }
            busy = true;
            status.textContent = "Двигатель вращается…";
          } catch (e) {
            if (moveGeneration === generation) {
              status.textContent = "Нет подтверждения запуска; останавливаем двигатель…";
              await stopMotor();
            }
          } finally {
            pendingMove = false;
            controls();
          }
        };
        document.getElementById("stop").onclick = stopMotor;
        async function update() {
          if (!stopping && !uncertain && !pendingMove) await refreshStatus();
          setTimeout(update, 1000);
        }
        update();
      </script>
    </main>
  </body>
</html>
